<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Pilot</title>
<style>
:root{--g:#123d33;--lime:#dff27e;--lav:#ece8f7;--pur:#6a4a9c;--bg:#f5f5ef;--ink:#12251f;--mut:#6b7872;--org:#fde8cb;--w:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#1f1f1f;display:flex;justify-content:center;padding:16px;color:var(--ink)}
#app{width:390px;height:780px;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:430px){body{padding:0}#app{width:100%;height:100vh;border-radius:0}}
#scr{flex:1;overflow-y:auto;padding:22px 18px 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
h1{font-size:22px;font-weight:700}
.big{font-size:30px;font-weight:700;line-height:1.15;margin:6px 0 16px}
.sm{font-size:12px;color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .sp{flex:1}
.back,.bell{width:34px;height:34px;border-radius:50%;background:var(--w);box-shadow:0 1px 3px #0001;font-size:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;font-style:normal}
.hero{background:var(--g);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero.pur{background:var(--pur)}
.hero .lab{font-size:11px;opacity:.75}
.hero .num{font-size:38px;font-weight:700;margin:4px 0 10px}
.pill{display:inline-block;background:var(--lime);color:var(--g);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.bar{height:6px;border-radius:9px;background:#0002;overflow:hidden;margin:6px 0}
.bar b{display:block;height:100%;border-radius:9px;background:var(--lime)}
.hero .bar{background:#ffffff30}
.meta{display:flex;justify-content:space-between;font-size:11px;opacity:.85}
.card{background:var(--w);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
.card.lav{background:var(--lav);box-shadow:none}
.card.org{background:var(--org);box-shadow:none}
.card.lime{background:var(--lime);box-shadow:none}
.link{font-size:12px;color:var(--pur);font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.row .sp{flex:1}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.amt{font-weight:700;font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-weight:700;font-size:16px}
.item{width:100%;text-align:left;margin-bottom:8px}
.week{display:flex;align-items:flex-end;gap:8px;height:64px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.week span{display:block;border-radius:5px;background:#c9bfe6;margin-bottom:4px}
.week .hi span{background:var(--pur)}
.chips{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;background:var(--w);font-size:12px;font-weight:600;border:1px solid #0001}
.chip.on{background:var(--lime);border-color:transparent}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid #0002;background:var(--w);color:var(--ink)}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{background:var(--w);border:1px solid #0002;border-radius:12px;padding:10px 0;font-size:11px}
.cats button.on{background:var(--lime);border-color:transparent;font-weight:700}
.cats button span{display:block;font-size:18px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--g);color:#fff;font-weight:600;text-align:center;margin-top:10px}
.btn.ghost{background:var(--w);color:var(--ink);border:1px solid #0001}
.amtbox{background:var(--lav);border-radius:16px;padding:14px 16px}
.amtbox input{border:0;background:none;font-size:34px;font-weight:700;padding:0}
.tbl div{display:flex;justify-content:space-between;padding:11px 0;font-size:13px;border-bottom:1px solid #0001}
.tbl div:last-child{border:0}
.tbl span{color:var(--mut)}
.step{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.step button{width:42px;height:42px;border-radius:12px;background:var(--w);font-size:22px;font-weight:700}
.step .plus{background:var(--pur);color:#fff}
.step output{font-size:36px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .card{margin:0}
.two b{font-size:20px;display:block;margin-top:4px}
ul.bl{list-style:none;padding:0}
ul.bl li{font-size:13px;padding:5px 0}
ul.bl li:before{content:"\2014\00a0\00a0";color:var(--mut)}
nav{display:flex;justify-content:space-around;padding:8px 10px 14px;background:var(--w);border-top:1px solid #0001}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 14px;border-radius:14px}
nav button.on{background:var(--lime);color:var(--ink);font-weight:700}
nav .add{background:var(--lime);color:var(--ink)}
</style>
</head>
<body>
<div id="app"><main id="scr"></main><nav id="nav"></nav></div>
<script>
const CAT={food:{n:'Food & drinks',i:'\u2615',c:'#f3dcb8',b:'#c98a3a',t:['Meals and snacks','Campus café','Groceries'],tip:'Pack lunch twice a week. Save around \u20b940 a month.'},
transport:{n:'Transport',i:'\ud83d\ude8c',c:'#dbe8c8',b:'#6f9a4a',t:['Campus commutes','Bus and train fares','Occasional rides'],tip:'Plan your next trip. Keep your travel spending in view before topping up your next pass.'},
education:{n:'Education',i:'\ud83d\udcd6',c:'#d9d0ee',b:'#7a55b0',t:['Books and course materials','Printing and stationery','Learning resources'],tip:'Make space for learning. Check what you have left before buying your next book or study resource.'},
other:{n:'Everything else',i:'\ud83c\udf92',c:'#e6e6dc',b:'#2c6b58',t:['Personal essentials','Subscriptions and entertainment','Other everyday purchases'],tip:'Leave room for the unexpected. A flexible category helps you plan for the little things outside your usual budget.'}};
const TODAY='Today, June 18';
const S={budget:{food:200,transport:80,education:200,other:320},base:{food:156,transport:42,education:110,other:120},
items:[{id:1,name:'Campus café',cat:'food',amt:6.5,day:TODAY,time:'10:42 AM',when:'Today'},
{id:2,name:'Bus to campus',cat:'transport',amt:6.5,day:TODAY,time:'8:15 AM',when:'Today'},
{id:3,name:'Design textbook',cat:'education',amt:32,day:'Yesterday, June 17',time:'4:30 PM',when:'Yesterday'},
{id:4,name:'Grocery run',cat:'food',amt:24.8,day:'Yesterday, June 17',time:'1:05 PM',when:'Yesterday',sub:'Groceries'},
{id:5,name:'Spotify Student',cat:'other',amt:5.99,day:'Yesterday, June 17',time:'9:00 AM',when:'Yesterday',sub:'Subscriptions'}],
added:0,nextId:6,view:'overview',arg:null,draft:200,filter:'all',q:'',newCat:'food'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'\u20b9'+n.toFixed(2);
const addedBy=k=>S.items.filter(e=>e.id>=100&&e.cat===k).reduce((a,e)=>a+e.amt,0);
const spent=k=>S.base[k]+addedBy(k);
const total=()=>Object.values(S.budget).reduce((a,b)=>a+b,0);
const used=()=>Object.keys(S.base).reduce((a,k)=>a+spent(k),0);
const count=()=>18+S.items.filter(e=>e.id>=100).length;
const week=()=>96.5+S.items.filter(e=>e.id>=100).reduce((a,e)=>a+e.amt,0);
const pct=(a,b)=>Math.min(100,Math.round(a/b*100));
const bar=(p,c)=>`<div class="bar"><b style="width:${p}%;${c?'background:'+c:''}"></b></div>`;
const backBtn=to=>`<button class="back" aria-label="Back" onclick="go('${to}')">\u2190</button>`;
function go(v,a){S.view=v;S.arg=a??null;if(v==='edit')S.draft=S.budget.food;render();document.getElementById('scr').scrollTop=0}

const V={
overview(){const left=total()-used();
const recent=S.items.slice().sort((a,b)=>b.id>=100?1:0).slice(0,2);
return `<div class="top"><div class="logo"><i>\u27a4</i><div>Pocket Pilot<div class="sm" style="font-weight:400">A little smarter with every spend.</div></div></div><span class="sp"></span><button class="bell" aria-label="Notifications">\ud83d\udd14</button></div>
<div class="sm">Hey, Alex</div><div class="big">Make room for what matters.</div>
<div class="hero"><div class="lab">LEFT TO SPEND</div><div class="num">${m(left)}</div><span class="pill">\u20b9${Math.round(left)} left</span>
${bar(pct(used(),total()))}<div class="meta"><span>June budget</span><span>\u20b9${Math.round(used())} of \u20b9${total()} spent</span></div><div class="sm" style="color:#fff;margin-top:8px">You're on track. Keep it up!</div></div>
<div class="card lav"><div class="row"><b class="sp">This week</b><span class="sm">\u2193 12% vs last week</span></div>
<div class="amt" style="font-size:24px;margin:4px 0">${m(week())}</div><button class="link" onclick="go('insights')">Explore week \u2192</button>${weekBars()}</div>
<div class="sec"><span>Recent expenses</span><button class="link" onclick="go('activity')">See all</button></div>${recent.map(itemRow).join('')}`},

activity(){return `<div class="top">${backBtn('overview')}<h1>Your activity</h1><span class="sp"></span><span class="sm">JUN 2025</span></div>
<input id="q" placeholder="Search expenses" value="${esc(S.q)}" oninput="S.q=this.value;list()" aria-label="Search expenses">
<div class="chips" id="chips"></div>
<div class="hero"><div class="lab">TOTAL SPENT THIS MONTH</div><div class="num" style="margin-bottom:0">${m(used())}</div><span class="pill">${count()} expenses</span></div><div id="list"></div>`},

budgets(){return `<div class="top">${backBtn('overview')}<h1>Your budgets</h1><span class="sp"></span><span class="sm">JUN 2025</span></div>
<div class="hero"><div class="row"><span class="lab sp">YOUR MONTHLY BUDGET</span><button class="pill" onclick="go('edit')">Edit</button></div>
<div class="num">\u20b9${total().toFixed(2)}</div><div class="meta"><span>\u20b9${Math.round(used())} spent</span><span>\u20b9${Math.round(total()-used())} available</span></div></div>
<div class="sec"><span>A plan for every penny</span></div>
${Object.keys(CAT).map(k=>{const c=CAT[k],s=spent(k),b=S.budget[k];return `<button class="card item" onclick="go('${k==='food'?'edit':'cat'}','${k}')"><div class="row"><span class="ico" style="background:${c.c}">${c.i}</span><b class="sp">${c.n}</b><span class="sm">\u20b9${Math.round(s)} / \u20b9${b}</span></div>${bar(pct(s,b),c.b)}<span class="sm">\u20b9${Math.max(0,Math.round(b-s))} left</span></button>`}).join('')}
<div class="card lav"><b>Small swaps, bigger plans.</b><div class="sm" style="margin-top:4px">Pack lunch twice a week. Save around \u20b940/month.</div></div>`},

add(){const c=S.newCat;return `<div class="top">${backBtn('overview')}<h1>Add expense</h1></div>
<div class="amtbox"><span class="sm">HOW MUCH DID YOU SPEND?</span><div class="row"><span style="font-size:28px;font-weight:700">\u20b9</span><input id="amt" type="number" min="0" step="0.5" value="6.50" aria-label="Amount in rupees"><span class="sm">INR</span></div></div>
<label for="nm">Expense name</label><input id="nm" value="Campus café">
<label>Category</label><div class="cats">${[['food','Food'],['transport','Travel'],['education','Education'],['other','Other']].map(([k,l])=>`<button class="${c===k?'on':''}" onclick="S.newCat='${k}';keep();render()"><span>${CAT[k].i}</span>${l}</button>`).join('')}</div>
<div class="two" style="margin-top:12px"><div><label for="dt">Date</label><input id="dt" value="Today, Jun 18" readonly></div><div><label for="pd">Paid with</label><select id="pd"><option>Debit card</option><option>Cash</option><option>UPI</option></select></div></div>
<label for="nt">Note (optional)</label><textarea id="nt" rows="2">Coffee before the morning lecture</textarea>
<button class="btn" onclick="save()">Save expense</button><div class="sm" style="text-align:center;margin-top:8px">Added to your June ${CAT[c].n.toLowerCase()} budget</div><div class="sm" style="text-align:center;margin-top:6px">Every little expense counts.</div>`},

detail(){const e=S.items.find(x=>x.id===S.arg)||S.items[0],c=CAT[e.cat];
return `<div class="top">${backBtn('activity')}<h1>Expense details</h1></div>
<div class="hero"><div class="lab">RECORDED EXPENSE</div><div class="num" style="margin-bottom:2px">${m(e.amt)}</div><div style="font-size:16px;margin-bottom:10px">${esc(e.name)}</div><span class="pill">${c.n}</span></div>
<div class="sec"><span>The details</span></div><div class="card tbl"><div><span>Category</span><b>${c.n}</b></div><div><span>When</span><b>${e.when}</b></div><div><span>Type</span><b>Expense</b></div></div>
<div class="card org"><b>Little spends. Big picture.</b><div class="sm" style="margin-top:4px">Knowing where your money goes is the first step to making it go further.</div></div>
<button class="btn ghost" onclick="go('activity')">View all expenses \u2192</button><button class="btn" onclick="go('overview')">Back to overview</button>`},

insights(){return `<div class="top">${backBtn('overview')}<h1>Your money, in focus</h1></div>
<div class="hero pur"><div class="lab">THIS WEEK</div><div class="num" style="margin-bottom:2px">${m(week())}</div><div style="font-size:16px;margin-bottom:10px">Weekly insights</div><span class="pill" style="background:var(--lav);color:var(--pur)">12% less than last week</span></div>
<div class="sec"><span>Your weekly rhythm</span></div><div class="card"><div class="sm">Saturday was your highest-spend day.</div>${weekBars()}</div>
<div class="card lime"><b>Keep the momentum going.</b><div class="sm" style="color:var(--ink);margin-top:4px">Your spending is down 12%. Small, consistent choices make room for bigger plans.</div></div>
<button class="btn ghost" onclick="go('budgets')">Check my budgets \u2192</button><button class="btn" onclick="go('overview')">Back to overview</button>`},

edit(){const d=S.draft,mt=total()-S.budget.food+d;
return `<div class="top">${backBtn('budgets')}<h1>Edit budget</h1></div>
<b style="font-size:18px">Food & drinks</b><div class="sm" style="margin:2px 0 12px">A little planning for your everyday favorites.</div>
<div class="card lav"><div class="sm">MONTHLY LIMIT</div><div class="step"><button aria-label="Decrease by 50" onclick="nudge(-50)">\u2212</button><output>\u20b9${d}</output><button class="plus" aria-label="Increase by 50" onclick="nudge(50)">+</button></div>
<div class="sm" style="text-align:center">Adjust in \u20b950 steps<br>Range: \u20b9200\u2013\u20b91,000 per month</div></div>
<div class="two"><div class="card"><span class="sm">Monthly budget</span><b>\u20b9${mt}</b></div><div class="card lime"><span class="sm" style="color:var(--ink)">Available to spend</span><b>\u20b9${Math.round(mt-used())}</b></div></div>
<b>One change. Everything in sync.</b><div class="sm" style="margin:4px 0 6px">Your monthly budget and available balance update with this category. Other category limits stay unchanged.</div>
<button class="btn ghost" onclick="S.draft=200;render()">Reset to \u20b9200</button><button class="btn" onclick="S.budget.food=S.draft;go('budgets')">Save budget</button>`},

cat(){const k=S.arg,c=CAT[k],b=S.budget[k],s=spent(k),dark=k==='education'?'pur':'';
return `<div class="top">${backBtn('budgets')}<div><h1>${c.n}</h1><div class="sm">Category budget \u00b7 June 2025</div></div></div>
<div class="hero ${dark}"><div class="lab">MONTHLY BUDGET</div><div class="num" style="margin-bottom:2px">\u20b9${b.toFixed(2)}</div><div class="sm" style="color:#fff">June 2025</div>${bar(pct(s,b))}<div class="meta"><span>\u20b9${Math.round(s)} of \u20b9${b} spent</span><span>${pct(s,b)}% used</span></div></div>
<div class="two"><div class="card"><span class="sm">Spent this month</span><b>${m(s)}</b></div><div class="card lime"><span class="sm" style="color:var(--ink)">Available to spend</span><b>${m(Math.max(0,b-s))}</b></div></div>
<div class="sec"><span>What belongs here</span></div><div class="card"><ul class="bl">${c.t.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="card lav"><div class="sm" style="color:var(--ink)">${c.tip}</div></div><button class="btn" onclick="go('budgets')">Back to budgets</button>`}
};

function weekBars(){const v=[20,34,26,44,38,60,14],d='MTWTFSS';
return `<div class="week">${v.map((h,i)=>`<div class="${i===5?'hi':''}"><span style="height:${h}px"></span>${d[i]}</div>`).join('')}</div>`}
function itemRow(e){const c=CAT[e.cat];
return `<button class="card item" onclick="go('detail',${e.id})"><div class="row"><span class="ico" style="background:${c.c}">${c.i}</span><div class="sp"><b style="font-size:14px">${esc(e.name)}</b><div class="sm">${e.sub||c.n} \u00b7 ${e.time}</div></div><span class="amt">\u2212${m(e.amt)}</span></div></button>`}
function list(){const f=S.filter,q=S.q.toLowerCase();
const rows=S.items.filter(e=>(f==='all'||e.cat===f)&&e.name.toLowerCase().includes(q));
const days=[...new Set(rows.map(e=>e.day))];
document.getElementById('list').innerHTML=rows.length?days.map(d=>`<div class="sm" style="margin:10px 0 6px">${d}</div>`+rows.filter(e=>e.day===d).map(itemRow).join('')).join(''):'<div class="sm">No expenses match. Try another filter or search.</div>';
document.getElementById('chips').innerHTML=[['all','All'],['food','Food'],['transport','Travel'],['education','Education']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="S.filter='${k}';list()">${l}</button>`).join('')}
function nudge(n){S.draft=Math.min(1000,Math.max(200,S.draft+n));render()}
const draft={};
function keep(){draft.amt=document.getElementById('amt').value;draft.nm=document.getElementById('nm').value;draft.nt=document.getElementById('nt').value}
function save(){const a=parseFloat(document.getElementById('amt').value);
if(!(a>0)){document.getElementById('amt').focus();return}
const id=100+S.items.length;
S.items.unshift({id,name:document.getElementById('nm').value.trim()||'Expense',cat:S.newCat,amt:a,day:TODAY,time:'Just now',when:'Today'});
go('detail',id)}
function render(){document.getElementById('scr').innerHTML=V[S.view]();
if(S.view==='activity')list();
if(S.view==='add'&&draft.nm!==undefined){document.getElementById('amt').value=draft.amt;document.getElementById('nm').value=draft.nm;document.getElementById('nt').value=draft.nt}
const tabs=[['overview','\u2302','Home'],['activity','\u2630','Activity'],['budgets','\u25d4','Budgets']];
const nav=document.getElementById('nav'),show=['overview','activity','budgets','add'].includes(S.view);
nav.style.display=show?'flex':'none';
nav.innerHTML=tabs.map(([k,i,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')+`<button class="${S.view==='add'?'on':'add'}" onclick="go('add')"><span>+</span>Add</button>`}
render();
</script>
</body>
</html>
